<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GALYON — El futuro del campo crece naturalmente</title>
  <meta name="description" content="GALYON: bioinsumos agrícolas de vanguardia, análisis de fertilidad de suelo y orientación técnica especializada en Ecuador." />
  <link rel="icon" href="assets/marca-hojas.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=UnifrakturCook:wght@700&amp;family=Instrument+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0b0b0c;
      --sky: #dbe6ee;
      --forest: #143d2c;
      --nav-gap: clamp(0.75rem, 1.4vw, 1.75rem);
      --pad-x: clamp(1.25rem, 4vw, 3.6rem);
      --ease: cubic-bezier(.22, 1, .36, 1);
      --ease-in-out: cubic-bezier(.76, 0, .24, 1);
      --poster: url("assets/galyon-bg-poster.jpg");
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--sky);
      overflow-x: hidden;
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    body.menu-open {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    /* ==========================================================================
       HERO & MEDIA (FONDO DE PAISAJE GALYON — SIN TOCADISCOS)
       ========================================================================== */
    .hero {
      position: relative;
      min-height: 100svh;
      height: 100svh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--sky);
    }

    .hero__media {
      position: absolute;
      inset: 0;
      z-index: 0;
      transform: scale(1.06);
      filter: blur(12px);
      opacity: 0;
      animation: mediaIn 1.8s var(--ease) .1s forwards;
    }

    @keyframes mediaIn {
      to {
        transform: scale(1);
        filter: blur(0);
        opacity: 1;
      }
    }

    .hero__media::before {
      content: "";
      display: none;
      position: absolute;
      inset: -8%;
      z-index: 0;
      background: var(--poster) center 22% / cover no-repeat;
      filter: blur(28px) saturate(104%);
      transform: scale(1.05);
    }

    .hero__media img,
    .hero__media video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 60%;
      display: block;
    }

    .hero__media img {
      z-index: 1;
    }

    .hero__media video {
      z-index: 2;
      opacity: 0;
      transition: opacity 1.2s ease;
    }

    .hero__media video.is-ready {
      opacity: 1;
    }

    .hero__media::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(226, 236, 243, .45) 0%, rgba(226, 236, 243, .12) 35%, rgba(226, 236, 243, 0) 60%),
        radial-gradient(120% 70% at 50% 0%, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 65%);
    }

    /* ==========================================================================
       NAV
       ========================================================================== */
    .nav {
      position: relative;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: clamp(1rem, 2.2vw, 1.8rem) var(--pad-x);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: "UnifrakturCook", serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 2.4vw, 1.9rem);
      line-height: 1;
      letter-spacing: .01em;
      white-space: nowrap;
    }

    .logo-leaf {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .nav__links {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: var(--nav-gap);
      list-style: none;
      margin: 0;
      padding: 0;
      white-space: nowrap;
    }

    .nav__links a {
      font-size: clamp(.88rem, 1vw, 1.05rem);
      letter-spacing: .005em;
      padding: .15rem 0;
      display: inline-block;
      position: relative;
    }

    .nav__links a::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -2px;
      height: 1px;
      background-color: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform .5s var(--ease);
    }

    .nav__links a:hover::after,
    .nav__links a.is-active::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    .nav__right {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .nav__signup {
      font-size: clamp(.88rem, 1vw, .95rem);
      font-weight: 500;
      padding: .4rem .6rem;
      color: var(--ink);
      transition: opacity .3s var(--ease);
    }

    .nav__signup:hover {
      opacity: .75;
    }

    .btn-play {
      background: var(--ink);
      color: #fff;
      border-radius: 6px;
      padding: .72rem 1.15rem;
      font-size: .95rem;
      line-height: 1;
      white-space: nowrap;
      display: inline-block;
      transition: transform .45s var(--ease), background-color .45s var(--ease), box-shadow .45s var(--ease);
    }

    .btn-play:hover {
      transform: translateY(-2px);
      background-color: #1e1e21;
      box-shadow: 0 10px 24px -12px rgba(0, 0, 0, .6);
    }

    .btn-play:active {
      transform: translateY(0);
    }

    /* Hamburger */
    .burger {
      display: none;
      width: 44px;
      height: 44px;
      margin-right: -8px;
      position: relative;
      z-index: 60;
      border-radius: 8px;
      flex: 0 0 auto;
      cursor: pointer;
      background: transparent;
      border: none;
      padding: 0;
    }

    .burger span {
      position: absolute;
      left: 11px;
      width: 22px;
      height: 1.6px;
      background: var(--ink);
      border-radius: 2px;
      transition: transform .55s var(--ease-in-out), opacity .3s ease, width .55s var(--ease-in-out);
    }

    .burger span:nth-child(1) {
      top: 17px;
    }

    .burger span:nth-child(2) {
      top: 22px;
      width: 15px;
    }

    .burger span:nth-child(3) {
      top: 27px;
    }

    .burger.is-active span:nth-child(1) {
      transform: translateY(5px) rotate(45deg);
    }

    .burger.is-active span:nth-child(2) {
      opacity: 0;
      transform: translateX(10px);
    }

    .burger.is-active span:nth-child(3) {
      transform: translateY(-5px) rotate(-45deg);
    }

    /* ==========================================================================
       HEADLINE & 3D STAGE INNER
       ========================================================================== */
    .hero__inner {
      position: relative;
      z-index: 10;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(0.8rem, 2.5vh, 2.2rem) var(--pad-x) 0;
      box-sizing: border-box;
    }

    .headline {
      margin: 0;
      font-family: "Instrument Serif", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.4rem, 5.2vw, 5.8rem);
      line-height: 1.05;
      letter-spacing: -.005em;
      text-align: center;
    }

    .line {
      display: block;
      overflow: hidden;
      white-space: nowrap;
      padding-bottom: .06em;
      margin-bottom: -.06em;
    }

    .line > span {
      display: block;
      transform: translateY(110%);
      opacity: 0;
      animation: lineUp 1.25s var(--ease) forwards;
    }

    @keyframes lineUp {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .headline .line:nth-child(1) > span {
      animation-delay: .55s;
    }

    .headline .line:nth-child(2) > span {
      animation-delay: .68s;
    }

    /* ==========================================================================
       FRASCO 3D GALYON REACTIVO A SCROLL (DIRECTO SOBRE EL PAISAJE)
       ========================================================================== */
    .hero-3d-stage {
      position: relative;
      width: 100%;
      max-width: 980px;
      flex: 1;
      min-height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: -6px;
      touch-action: none;
    }

    .webgl-canvas-mount {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
      outline: none;
      background: transparent;
    }

    .webgl-canvas-mount canvas {
      filter: drop-shadow(0 22px 35px rgba(10, 35, 22, 0.22));
      transition: filter 0.3s ease;
    }

    .webgl-canvas-mount.is-dragging canvas,
    .webgl-canvas-mount:active canvas {
      filter: drop-shadow(0 28px 45px rgba(10, 35, 22, 0.32));
    }

    .webgl-canvas-mount.is-dragging,
    .webgl-canvas-mount:active {
      cursor: grabbing;
    }

    /* Spinner de carga 3D */
    .viewer3d-loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.3s ease;
    }

    .viewer3d-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-top-color: var(--forest);
      border-radius: 50%;
      animation: viewer3d-spin 0.8s linear infinite;
    }

    @keyframes viewer3d-spin {
      to { transform: rotate(360deg); }
    }

    /* Indicador interactivo de scroll 3D */
    .scroll-indicator {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 15px;
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(18, 40, 28, 0.12);
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--forest);
      pointer-events: none;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      opacity: 0.95;
      transition: opacity 0.45s ease, transform 0.45s ease;
      z-index: 20;
    }

    .scroll-indicator-mouse {
      width: 13px;
      height: 19px;
      border: 1.6px solid var(--forest);
      border-radius: 9px;
      position: relative;
      display: flex;
      justify-content: center;
    }

    .scroll-indicator-wheel {
      width: 2px;
      height: 4px;
      background: var(--forest);
      border-radius: 1px;
      margin-top: 3px;
      animation: scrollWheel 1.6s ease-in-out infinite;
    }

    @keyframes scrollWheel {
      0% { transform: translateY(0); opacity: 1; }
      60% { transform: translateY(5px); opacity: 0; }
      61% { transform: translateY(-2px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    /* ==========================================================================
       STAGGER DELAY UTILITIES
       ========================================================================== */
    .rise {
      opacity: 0;
      transform: translateY(-14px);
      animation: rise .95s var(--ease) forwards;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .d1 { animation-delay: .18s; }
    .d2 { animation-delay: .26s; }
    .d3 { animation-delay: .32s; }
    .d4 { animation-delay: .38s; }
    .d5 { animation-delay: .44s; }
    .d6 { animation-delay: .52s; }

    /* ==========================================================================
       MOBILE MENU OVERLAY
       ========================================================================== */
    .menu {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 var(--pad-x);
      background: rgba(233, 240, 246, .92);
      backdrop-filter: blur(22px) saturate(140%);
      -webkit-backdrop-filter: blur(22px) saturate(140%);
      clip-path: inset(0 0 100% 0);
      visibility: hidden;
      transition: clip-path .85s var(--ease-in-out), visibility 0s linear .85s;
    }

    .menu.is-open {
      clip-path: inset(0 0 0 0);
      visibility: visible;
      transition: clip-path .85s var(--ease-in-out), visibility 0s linear 0s;
    }

    .menu__list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .menu__list li {
      overflow: hidden;
    }

    .menu__list a {
      font-family: "Instrument Serif", Georgia, serif;
      font-size: clamp(2.1rem, 9.5vw, 3.2rem);
      line-height: 1.25;
      padding: .1em 0;
      display: block;
      transform: translateY(115%);
      opacity: 0;
      transition: transform .8s var(--ease), opacity .6s ease;
    }

    .menu.is-open .menu__list a {
      transform: translateY(0);
      opacity: 1;
    }

    .menu.is-open .menu__list li:nth-child(1) a { transition-delay: .24s; }
    .menu.is-open .menu__list li:nth-child(2) a { transition-delay: .30s; }
    .menu.is-open .menu__list li:nth-child(3) a { transition-delay: .36s; }
    .menu.is-open .menu__list li:nth-child(4) a { transition-delay: .42s; }
    .menu.is-open .menu__list li:nth-child(5) a { transition-delay: .48s; }
    .menu.is-open .menu__list li:nth-child(6) a { transition-delay: .54s; }

    .menu__rule {
      height: 1px;
      background: rgba(11, 11, 12, .16);
      margin: 2rem 0 0;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .9s var(--ease);
    }

    .menu.is-open .menu__rule {
      transform: scaleX(1);
      transition-delay: .58s;
    }

    .menu__foot {
      margin-top: 2rem;
      opacity: 0;
      transform: translateY(22px);
      transition: transform .8s var(--ease), opacity .6s ease;
    }

    .menu.is-open .menu__foot {
      opacity: 1;
      transform: translateY(0);
      transition-delay: .64s;
    }

    .menu__foot .btn-play {
      display: inline-block;
      padding: .95rem 1.6rem;
      font-size: 1rem;
    }

    /* ==========================================================================
       RESPONSIVE BREAKPOINTS
       ========================================================================== */
    @media (max-width: 900px) {
      .nav__links,
      .nav__signup,
      .nav__right .btn-play {
        display: none;
      }

      .burger {
        display: block;
      }

      .hero__media video,
      .hero__media img {
        object-position: center 60%;
      }

      .hero__inner {
        align-items: center;
        padding-top: 1.2rem;
      }

      .line {
        white-space: normal;
      }

      .headline {
        font-size: clamp(2.1rem, 6.4vw, 3.2rem);
        max-width: 16ch;
      }

      .hero-3d-stage {
        min-height: 320px;
      }
    }

    @media (max-width: 900px) and (orientation: portrait) {
      .hero__media::before {
        display: block;
      }

      .hero__media video,
      .hero__media img {
        top: auto;
        bottom: 0;
        height: 64svh;
        object-position: center 62%;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, .6) 9%, #000 20%);
        -webkit-mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, .6) 9%, #000 20%);
      }
    }

    @media (max-width: 560px) {
      .headline {
        font-size: clamp(1.9rem, 8.5vw, 2.7rem);
        line-height: 1.12;
        max-width: 13ch;
      }

      .hero__inner {
        padding-top: clamp(1rem, 4vh, 2rem);
      }

      .hero-3d-stage {
        min-height: 290px;
      }

      .scroll-indicator {
        bottom: 8px;
        font-size: 10px;
        padding: 5px 12px;
      }
    }

    @media (max-height: 520px) and (orientation: landscape) {
      .headline {
        font-size: clamp(1.6rem, 5vw, 2.2rem);
        max-width: 24ch;
      }

      .hero__inner {
        padding-top: .5rem;
      }

      .hero-3d-stage {
        min-height: 220px;
      }

      .menu__list a {
        font-size: clamp(1.4rem, 5vw, 1.9rem);
      }

      .menu__rule,
      .menu__foot {
        margin-top: 1rem;
      }
    }

    /* Reduced Motion */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }

      .hero__media {
        opacity: 1 !important;
        transform: none !important;
        filter: none !important;
      }

      .line > span {
        transform: none !important;
        opacity: 1 !important;
      }

      .rise {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Three.js + Controles PBR para el Componente 3D del Frasco de GALYON reactivo a Scroll -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="viewer3d.js?v=1.3.0" defer></script>

  <!-- Script de interfaz y control de video -->
  <script>
    (function () {
      var menu = document.getElementById('menu');
      var burger = document.getElementById('burger');
      var video = document.getElementById('heroVideo');
      var isOpen = false;

      function setMenu(next) {
        isOpen = !!next;
        if (menu) menu.classList.toggle('is-open', isOpen);
        if (burger) {
          burger.classList.toggle('is-active', isOpen);
          burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          burger.setAttribute('aria-label', isOpen ? 'Close menu' : 'Open menu');
        }
        document.body.classList.toggle('menu-open', isOpen);
      }

      if (burger) {
        burger.addEventListener('click', function () {
          setMenu(!isOpen);
        });
      }

      if (menu) {
        menu.addEventListener('click', function (e) {
          if (e.target.closest('a')) {
            setMenu(false);
          }
        });
      }

      window.addEventListener('keydown', function (e) {
        if (isOpen && (e.key === 'Escape' || e.key === 'Esc')) {
          setMenu(false);
        }
      });

      window.addEventListener('resize', function () {
        if (isOpen && window.innerWidth > 900) {
          setMenu(false);
        }
      });

      if (video) {
        function reveal() {
          video.classList.add('is-ready');
        }

        if (video.readyState >= 3) {
          reveal();
        } else {
          video.addEventListener('loadeddata', reveal, { once: true });
          video.addEventListener('canplay', reveal, { once: true });
        }

        function kick() {
          var p = video.play();
          if (p && p.catch) {
            p.catch(function () {});
          }
        }

        kick();
        window.addEventListener('touchstart', kick, { once: true, passive: true });
        window.addEventListener('click', kick, { once: true });
      }
    })();
  </script>
</body>
</html>
