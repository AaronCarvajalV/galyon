<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALYON — Google AI Studio Render Hub (localhost:3000)</title>
  <link rel="icon" href="assets/marca-hojas.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: #0f1813;
      color: #e6eee8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header.hub-nav {
      height: 60px;
      background: rgba(14, 25, 19, 0.95);
      border-bottom: 1px solid rgba(84, 128, 97, 0.25);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      gap: 16px;
      z-index: 50;
      flex-shrink: 0;
    }
    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-group img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .brand-title {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 0.04em;
      color: #b8e28a;
    }
    .app-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(184, 226, 138, 0.12);
      border: 1px solid rgba(184, 226, 138, 0.28);
      color: #d1efaa;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 99px;
      font-weight: 600;
      text-decoration: none;
    }
    .app-badge:hover {
      background: rgba(184, 226, 138, 0.22);
    }
    .tabs-group {
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.4);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: 0;
      color: #9ab3a1;
      padding: 7px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      transition: all 0.2s ease;
    }
    .tab-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }
    .tab-btn.active {
      background: #1e3f2d;
      color: #c9f598;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .actions-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .device-switcher {
      display: flex;
      background: rgba(0, 0, 0, 0.3);
      padding: 3px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .dev-btn {
      background: transparent;
      border: 0;
      color: #8da494;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 5px;
      cursor: pointer;
    }
    .dev-btn.active {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
    }
    .link-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #173626;
      border: 1px solid #366d4e;
      color: #e5f6d7;
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 7px;
      transition: background 0.2s;
    }
    .link-btn:hover {
      background: #23543b;
    }
    .frame-container {
      flex: 1;
      background: #090e0b;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }
    iframe#main-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
      transition: width 0.3s ease, height 0.3s ease, box-shadow 0.3s ease;
    }
    iframe.device-tablet {
      width: 1024px;
      height: 90%;
      border-radius: 14px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
    }
    iframe.device-mobile {
      width: 390px;
      height: 844px;
      max-height: 94%;
      border-radius: 36px;
      box-shadow: 0 24px 70px rgba(0,0,0,0.7);
      border: 10px solid #202b23;
    }
  </style>
</head>
<body>
  <header class="hub-nav">
    <div class="brand-group">
      <img src="assets/marca-hojas.png" alt="GALYON">
      <span class="brand-title">GALYON Studio</span>
      <a class="app-badge" href="https://aistudio.google.com/apps/16031e9d-7e24-40d5-a703-af6ad6498d48" target="_blank" title="Abrir en Google AI Studio">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        App 16031e9d
      </a>
    </div>

    <div class="tabs-group">
      <button class="tab-btn active" onclick="loadView('/', this)">
        <span>🎨</span> Render Google AI Studio
      </button>
      <button class="tab-btn" onclick="open3DDirect(this)">
        <span>📦</span> Visor 3D TRICHO
      </button>
      <button class="tab-btn" onclick="loadView('/index.static.html', this)">
        <span>📄</span> Versión Clásica (v5.7)
      </button>
    </div>

    <div class="actions-group">
      <div class="device-switcher">
        <button class="dev-btn active" onclick="setDevice('full', this)">🖥️ Full</button>
        <button class="dev-btn" onclick="setDevice('tablet', this)">📱 Tablet</button>
        <button class="dev-btn" onclick="setDevice('mobile', this)">📲 Móvil</button>
      </div>

      <a class="link-btn" href="/" target="_blank" title="Abrir render en nueva pestaña">
        <span>Pantalla Completa</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
      </a>
    </div>
  </header>

  <main class="frame-container">
    <iframe id="main-frame" src="/"></iframe>
  </main>

  <script>
    const frame = document.getElementById('main-frame');

    function loadView(url, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frame.src = url;
    }

    function open3DDirect(btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frame.src = '/';
      frame.onload = () => {
        try {
          if (frame.contentWindow && frame.contentWindow.openModal) {
            frame.contentWindow.openModal('modal-visor3d');
          }
        } catch(e) {}
      };
    }

    function setDevice(type, btn) {
      document.querySelectorAll('.dev-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      frame.className = '';
      if (type === 'tablet') frame.classList.add('device-tablet');
      if (type === 'mobile') frame.classList.add('device-mobile');
    }
  </script>
</body>
</html>
